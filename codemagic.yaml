workflows:
  ios-automatic-code-signing:
    name: iOS automatic code signing
    instance_type: mac_mini_m1
    environment:
      groups:
        - appstore_credentials
        - ios_config
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain to be used for codesigning using Codemagic CLI 'keychain' command
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --verbose
      - name: Use system default keychain
        script: |
          keychain add-certificates --verbose
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --verbose
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR
          # 获取最新的 TestFlight 构建号
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID")
          # 将版本号中的小数点移除，转换为整数
          LATEST_BUILD_INT=$(echo $LATEST_BUILD | tr -d '.')
          # 增加版本号
          NEW_BUILD=$((LATEST_BUILD_INT + 1))
          # 更新版本号
          agvtool new-version -all $NEW_BUILD
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa --project "$CM_BUILD_DIR/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME" --verbose
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        submit_to_app_store: true
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
      email:
        recipients:
          - wenlianghua3@gmail.com
        notify:
          success: true
          failure: true